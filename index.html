<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fat Fox Studios</title>
    <!-- FontAwesome for the social media icons in the footer -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* 1. Global Reset & Theme Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --orange-main: #f3861d;
            --orange-light: #f5963a;
            --white: #ffffff;
            --text-dark: #333333;
        }

        body {
            background-color: var(--orange-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 2. Header & Navigation */
        header {
            background-color: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            border-bottom: 4px solid var(--orange-main);
        }

        .logo-placeholder {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--orange-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav a {
            color: var(--orange-main);
            text-decoration: none;
            font-weight: bold;
            margin-left: 25px;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--orange-light);
        }

        /* 3. Hero Section (The Curved White Banner) */
        .hero {
            background-color: var(--white);
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            /* Creates the rounded bottom layout from your image */
            border-bottom-left-radius: 80px;
            border-bottom-right-radius: 80px;
            padding: 40px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .main-brand {
            text-align: center;
        }

        /* Temporary styling for your main logo graphic placeholder */
        .main-logo-box {
            border: 4px solid var(--orange-main);
            padding: 20px 40px;
            border-radius: 15px;
            color: var(--orange-main);
            display: inline-block;
        }

        .main-logo-box h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 4. Footer Section */
        footer {
            background-color: var(--orange-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 5%;
            margin-top: auto;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            background-color: var(--white);
            color: var(--orange-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1.2rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .social-icons a:hover {
            transform: scale(1.1);
            background-color: #ffe8d1;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 600px) {
            header, footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            nav a {
                margin: 0 10px;
            }
            .hero {
                border-bottom-left-radius: 40px;
                border-bottom-right-radius: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header>
        <div class="logo-placeholder">
            🦊 <span>FATFOX STUDIOS</span>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- Curved Center Container -->
    <section class="hero">
        <div class="main-brand">
            <!-- Replace this box structure with an <img src="logo.png"> tag once you export your logo asset -->
            <div class="main-logo-box">
                <h1>FATFOX</h1>
                <hr style="border: 2px solid var(--orange-main); margin: 5px 0;">
                <h2>STUDIOS</h2>
            </div>
        </div>
    </section>

    <!-- Footer with Social Anchors -->
    <footer>
        <div class="logo-placeholder" style="color: var(--white);">
            🦊 <span>FATFOX STUDIOS</span>
        </div>
        <div class="social-icons">
            <!-- Linked to standard FontAwesome brand icons matching your layout -->
            <a href="#" title="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="#" title="Steam"><i class="fa-brands fa-steam"></i></a>
            <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
    </footer>

</body>
</html>
